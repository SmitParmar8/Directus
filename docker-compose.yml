version: "3"
services:
  directus:
    image: directus/directus:latest
    restart: unless-stopped
    ports:
      - "8055:8055"
    environment:
      SECRET: "my-super-secret-key-123"
      DB_CLIENT: "pg"
      DB_HOST: "host.docker.internal"  # ← points to your Mac's localhost
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "postgres"
      DB_PASSWORD: ""
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "admin"